name: Add a lab member
description: Add a current member to the People page.
title: "Person: "
labels: ["content: person"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in the fields below. Then click **Submit new issue**.
        The website prepares the change and opens a pull request. Look at it, then click **Merge** to publish.
        The new member is placed in the correct order by role (seniority).
  - type: input
    id: name
    attributes:
      label: Name
      description: The full name, as it should appear on the website.
      placeholder: Jane Doe
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Role
      description: Choose the role. This also sets the person's place in the list.
      options:
        - Principal Investigator
        - Lecturer
        - Postdoctoral Fellow
        - Graduate Student
        - Undergraduate Researcher
        - Associate Researcher
    validations:
      required: true
  - type: input
    id: note
    attributes:
      label: Extra note
      description: Optional. A second line under the role, for example "Former Graduate Student & NSF Fellow".
    validations:
      required: false
  - type: input
    id: email
    attributes:
      label: Email
      description: Optional. Leave empty if there is none.
      placeholder: jdoe@fas.harvard.edu
    validations:
      required: false
  - type: textarea
    id: bio
    attributes:
      label: Bio
      description: Optional. A short paragraph about the person.
    validations:
      required: false
  - type: textarea
    id: photo
    attributes:
      label: Photo
      description: Drag a photo into this box. It uploads automatically. Use a square photo, 600px or more.
      placeholder: Drag the photo here...
    validations:
      required: true
