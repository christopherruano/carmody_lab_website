name: Content bot

# When a lab member submits a content form (an issue whose title starts with a
# known prefix), this workflow edits the site the correct way and publishes it
# straight to the website. The "Undo" form reverts the last change. If a change is
# ever wrong, revert the commit (the history keeps every version) or ask Claude Code.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# Publish one change at a time so pushes to main do not collide.
concurrency:
  group: content-bot-main
  cancel-in-progress: false

jobs:
  run:
    # Only run for a content form, and only when a repo collaborator opened it.
    if: >
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      (startsWith(github.event.issue.title, 'News:') ||
       startsWith(github.event.issue.title, 'Person:') ||
       startsWith(github.event.issue.title, 'Remove person:') ||
       startsWith(github.event.issue.title, 'Edit person:') ||
       startsWith(github.event.issue.title, 'Publication:') ||
       startsWith(github.event.issue.title, 'Edit publication:') ||
       startsWith(github.event.issue.title, 'Remove publication:') ||
       startsWith(github.event.issue.title, 'Edit text:') ||
       startsWith(github.event.issue.title, 'Undo:'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Choose the script
        id: route
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          s=; page=; mode=generate
          if [[ "$TITLE" == News:* ]]; then s=add-news.mjs; page=news.html
          elif [[ "$TITLE" == "Remove person:"* ]]; then s=delete-person.mjs; page=people.html
          elif [[ "$TITLE" == "Edit person:"* ]]; then s=edit-person.mjs; page=people.html
          elif [[ "$TITLE" == Person:* ]]; then s=add-person.mjs; page=people.html
          elif [[ "$TITLE" == "Remove publication:"* ]]; then s=remove-publication.mjs; page=publications.html
          elif [[ "$TITLE" == "Edit publication:"* ]]; then s=edit-publication.mjs; page=publications.html
          elif [[ "$TITLE" == Publication:* ]]; then s=add-publication.mjs; page=publications.html
          elif [[ "$TITLE" == "Edit text:"* ]]; then s=edit-text.mjs
          elif [[ "$TITLE" == Undo:* ]]; then mode=undo
          fi
          {
            echo "script=$s"
            echo "page=$page"
            echo "mode=$mode"
          } >> "$GITHUB_OUTPUT"

      - name: Make the change
        id: gen
        if: steps.route.outputs.mode == 'generate'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node "scripts/${{ steps.route.outputs.script }}"

      - name: Publish to the website
        if: steps.route.outputs.mode == 'generate'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SUMMARY: ${{ steps.gen.outputs.summary }}
          PAGE: ${{ steps.route.outputs.page }}
        run: |
          set -e
          git config user.name "carmody-content-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$SUMMARY"
          git pull --rebase origin main
          git push origin HEAD:main
          URL="https://nme.fas.harvard.edu/${PAGE}"
          gh issue comment "$ISSUE_NUMBER" --body "Done. \"$SUMMARY\" is now on the website. See it here: $URL — it appears in about 1 minute. If it is wrong, use the \"Undo the last change\" form, or ask Claude Code."
          gh issue close "$ISSUE_NUMBER"

      - name: Undo the last change
        if: steps.route.outputs.mode == 'undo'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -e
          git config user.name "carmody-content-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SHA=$(git log --author="carmody-content-bot" -n 1 --format=%H || true)
          if [ -z "$SHA" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "There is no recent form change to undo."
            gh issue close "$ISSUE_NUMBER"
            exit 0
          fi
          SUBJECT=$(git log -1 --format=%s "$SHA")
          git revert --no-edit "$SHA"
          git pull --rebase origin main
          git push origin HEAD:main
          gh issue comment "$ISSUE_NUMBER" --body "Done. I undid the last change (\"$SUBJECT\"). The website is back to how it was, in about 1 minute."
          gh issue close "$ISSUE_NUMBER"

      - name: Report a problem
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Sorry, I could not do this, so nothing changed on the website. Please check what you filled in, or ask Claude Code to help."
