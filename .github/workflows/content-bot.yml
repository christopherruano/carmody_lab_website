name: Content bot

# When a lab member submits a content form (an issue whose title starts with a
# known prefix), this workflow edits the site the correct way and publishes it
# straight to the website. If a change is ever wrong, revert the commit (the
# history keeps every version) or ask Claude Code to undo it.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# Publish one change at a time so pushes to main do not collide.
concurrency:
  group: content-bot-main
  cancel-in-progress: false

jobs:
  run:
    # Only run for a content form, and only when a repo collaborator opened it.
    if: >
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      (startsWith(github.event.issue.title, 'News:') ||
       startsWith(github.event.issue.title, 'Person:') ||
       startsWith(github.event.issue.title, 'Remove person:') ||
       startsWith(github.event.issue.title, 'Edit person:') ||
       startsWith(github.event.issue.title, 'Edit text:') ||
       startsWith(github.event.issue.title, 'Publication:'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Choose the script
        id: route
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          if [[ "$TITLE" == News:* ]]; then s=add-news.mjs
          elif [[ "$TITLE" == "Remove person:"* ]]; then s=delete-person.mjs
          elif [[ "$TITLE" == "Edit person:"* ]]; then s=edit-person.mjs
          elif [[ "$TITLE" == Person:* ]]; then s=add-person.mjs
          elif [[ "$TITLE" == "Edit text:"* ]]; then s=edit-text.mjs
          elif [[ "$TITLE" == Publication:* ]]; then s=add-publication.mjs
          fi
          echo "script=$s" >> "$GITHUB_OUTPUT"

      - name: Make the change
        id: gen
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node "scripts/${{ steps.route.outputs.script }}"

      - name: Publish to the website
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SUMMARY: ${{ steps.gen.outputs.summary }}
        run: |
          set -e
          git config user.name "carmody-content-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$SUMMARY"
          git pull --rebase origin main
          git push origin HEAD:main
          gh issue comment "$ISSUE_NUMBER" --body "Done. \"$SUMMARY\" is now on the website. It appears in about 1 minute. If it is wrong, comment here or ask Claude Code to undo it."
          gh issue close "$ISSUE_NUMBER"

      - name: Report a problem
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Sorry, I could not make this change, so nothing was published. Please check the fields you filled in, or ask Claude Code to make the change."
